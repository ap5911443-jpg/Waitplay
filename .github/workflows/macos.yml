name: macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Nothing in this workflow may write to the repository, except the `release` job below that says so.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon runners are capacity-limited; the Intel runner cross-builds arm64 and runs the tests natively
          - { target: aarch64-apple-darwin, runner: macos-15-intel }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # `stable` is a moving branch: the action is pinned to a commit and the toolchain channel is passed as an input
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          export WAITPLAY_BUILD="$(git rev-parse --short HEAD)"
          cargo build --release --workspace --target ${{ matrix.target }} 2>&1 | tee build.log || { bash .github/scripts/annotate.sh build.log "cargo build (${{ matrix.target }})"; exit 1; }

      - name: Test (native architecture)
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --target ${{ matrix.target }} -- --test-threads=4 2>&1 | tee test.log || { bash .github/scripts/annotate.sh test.log "cargo test"; exit 1; }

      # No signing secrets exist in this job. It produces the ad-hoc signed development build; Developer ID signing and
      # notarization happen in the separate `sign` job below.
      - name: Package VibePlay.app and DMG
        shell: bash
        # (no environment: unsigned development build)
        run: |
          set -o pipefail
          export WAITPLAY_BUILD="$(git rev-parse --short HEAD)"
          bash packaging/macos/build_app.sh ${{ matrix.target }} 2>&1 | tee package.log || { bash .github/scripts/annotate.sh package.log "package (${{ matrix.target }})"; exit 1; }


      # the raw binaries for the `sign` job (a different job, so the signing secrets never share a job with `cargo build`)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/waitplay
            target/${{ matrix.target }}/release/waitplay-bridge
            target/${{ matrix.target }}/release/waitplay-hook
          if-no-files-found: error
          retention-days: 1

      # A SEPARATE binary with the `test-hooks` feature, used only by the screenshot scenario of the smoke test. It is built after
      # the shipped binaries were packaged and uploaded, is never packaged or published, and the shipped app has no test switches.
      - name: Build the smoke-test-only binary (test hooks)
        shell: bash
        run: |
          cargo build --release -p waitplay-app --features test-hooks --target ${{ matrix.target }}
          # the app starts the bridge and the hooks from the folder it runs from, so they sit next to it
          mkdir -p testhooks
          cp target/${{ matrix.target }}/release/waitplay target/${{ matrix.target }}/release/waitplay-bridge target/${{ matrix.target }}/release/waitplay-hook testhooks/

      # for the Apple Silicon smoke job only. The name matches neither download pattern of the release job, so it is never published
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.target == 'aarch64-apple-darwin'
        with:
          name: testhooks-aarch64
          path: testhooks
          if-no-files-found: error
          retention-days: 1

      - name: Smoke test the bundle
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -o pipefail
          APP="dist/${{ matrix.target }}/VibePlay.app"
          {
            plutil -lint "$APP/Contents/Info.plist"
            file "$APP/Contents/MacOS/waitplay"
            codesign -dv "$APP" 2>&1 | head -5
            # the hook binary runs and the bridge answers after the app bundle is relocated
            "$APP/Contents/MacOS/waitplay-hook" --help | head -3
          } 2>&1 | tee smoke.log || { bash .github/scripts/annotate.sh smoke.log "bundle smoke test"; exit 1; }

      # Runs the real app on this macOS session: menu bar, bridge, widget, settings window, hook -> entertainment window,
      # concurrent sessions, idle CPU. Informational for the DMG (continue-on-error) but its result is annotated and its logs and
      # screenshots are uploaded.
      - name: Runtime smoke test (real app, real hooks)
        id: runtime
        if: matrix.target == 'x86_64-apple-darwin'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          WAITPLAY_TESTHOOKS_BIN="$PWD/testhooks/waitplay" bash packaging/macos/smoke.sh "dist/${{ matrix.target }}/VibePlay.app" smoke-out 2>&1 | tee smoke-run.log

      - name: Annotate runtime smoke result
        if: always() && matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          if [ -f smoke-run.log ]; then
            msg="$(sed -e 's/%/%25/g' -e 's/\r//g' smoke-run.log | awk '{printf "%s%%0A", $0}')"
            if grep -q "SMOKE TEST PASSED" smoke-run.log; then echo "::notice title=runtime smoke test::${msg}"; else echo "::error title=runtime smoke test::${msg}"; fi
            if [ -f smoke-out/waitplay.log ]; then
              msg="$(tail -60 smoke-out/waitplay.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')"
              echo "::notice title=app log (tail)::${msg}"
            fi
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.target == 'x86_64-apple-darwin'
        with:
          name: smoke-output
          path: |
            smoke-out
            smoke-run.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: VibePlay-${{ matrix.target }}
          path: |
            dist/${{ matrix.target }}/*.dmg
          if-no-files-found: error

  # Developer ID signing, Hardened Runtime and notarization. WAITING FOR AN ACTIVE APPLE DEVELOPER MEMBERSHIP: this job is skipped
  # until the repository variable APPLE_SIGNING_ENABLED is set to `true` (see docs/RELEASE_SIGNING.md). It runs no cargo build: it takes
  # the binaries built above, and the signing secrets exist in exactly one step (the import step), in a protected environment.
  sign:
    name: sign and notarize (${{ matrix.target }})
    needs: build
    if: vars.APPLE_SIGNING_ENABLED == 'true' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: macos-15-intel
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: binaries-${{ matrix.target }}
          path: signed-input

      # The ONLY step that receives signing secrets.
      - name: Import certificate and store notary credentials
        shell: bash
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_API_KEY_P8: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: bash .github/scripts/import_signing.sh

      - name: Package, sign, notarize and staple
        shell: bash
        run: |
          chmod +x signed-input/*
          export WAITPLAY_BUILD="$(git rev-parse --short HEAD)"
          WAITPLAY_BIN_DIR="$PWD/signed-input" bash packaging/macos/build_app.sh ${{ matrix.target }}

      - name: Verify as a user's Mac will
        shell: bash
        run: bash packaging/macos/verify_release.sh dist/${{ matrix.target }}/*.dmg

      - name: Remove the signing keychain
        if: always()
        shell: bash
        run: |
          [ -z "${APPLE_KEYCHAIN:-}" ] || security delete-keychain "$APPLE_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP"/certificate.p12 "$RUNNER_TEMP"/notary-key.p8

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-VibePlay-${{ matrix.target }}
          path: dist/${{ matrix.target }}/*.dmg
          if-no-files-found: error

  # Publishes the DMGs. Only this job can write to the repository, and it runs no build code: it downloads the artifacts built
  # above, records their SHA-256 sums, attaches a signed build-provenance attestation (verify with `gh attestation verify`),
  # and uploads with the preinstalled GitHub CLI (no third-party release action). Signed DMGs when the sign job ran; otherwise the
  # ad-hoc development DMGs, renamed *-UNSIGNED.dmg and published as a pre-release so nobody mistakes them for a distribution build.
  release:
    name: publish release
    needs: [build, sign]
    if: always() && needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: signed-VibePlay-*
          path: signed
          merge-multiple: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: VibePlay-*-apple-darwin
          path: unsigned
          merge-multiple: true

      - name: Choose the files and write checksums
        run: |
          mkdir publish
          if [ "${{ needs.sign.result }}" = "success" ] && ls signed/*.dmg >/dev/null 2>&1; then
            cp signed/*.dmg publish/
            echo "PRERELEASE=" >> "$GITHUB_ENV"
          else
            for f in unsigned/*.dmg; do cp "$f" "publish/$(basename "$f" .dmg)-UNSIGNED.dmg"; done
            echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV"
          fi
          cd publish
          sha256sum *.dmg > SHA256SUMS-macos.txt
          cat SHA256SUMS-macos.txt

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: publish/*.dmg

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes $PRERELEASE
          gh release upload "$TAG" publish/*.dmg publish/SHA256SUMS-macos.txt --clobber

  # Runs the arm64 build on a real Apple Silicon runner. Those runners are capacity-limited, so this job must never block the
  # release: it is allowed to fail or be cancelled; when it does run it is the only proof that the arm64 binary works.
  arm64-runtime:
    name: arm64 runtime smoke test
    needs: build
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: VibePlay-aarch64-apple-darwin
          path: dmg

      - name: Install the app from the DMG
        shell: bash
        run: |
          set -euo pipefail
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/wp-dmg" dmg/*.dmg
          cp -R "$RUNNER_TEMP/wp-dmg/VibePlay.app" ./VibePlay.app
          hdiutil detach "$RUNNER_TEMP/wp-dmg"
          file VibePlay.app/Contents/MacOS/waitplay

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: testhooks-aarch64
          path: testhooks

      - name: Runtime smoke test on Apple Silicon
        id: runtime
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          chmod +x testhooks/*
          WAITPLAY_TESTHOOKS_BIN="$PWD/testhooks/waitplay" bash packaging/macos/smoke.sh VibePlay.app smoke-out 2>&1 | tee smoke-run.log

      - name: Annotate result
        if: always()
        shell: bash
        run: |
          if [ -f smoke-run.log ]; then
            msg="$(sed -e 's/%/%25/g' -e 's/\r//g' smoke-run.log | awk '{printf "%s%%0A", $0}')"
            if grep -q "SMOKE TEST PASSED" smoke-run.log; then echo "::notice title=arm64 runtime smoke test::${msg}"; else echo "::error title=arm64 runtime smoke test::${msg}"; fi
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: smoke-output-arm64
          path: |
            smoke-out
            smoke-run.log
          if-no-files-found: ignore
